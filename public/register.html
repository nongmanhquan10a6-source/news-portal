<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng ký - Tin Mới</title><link rel="stylesheet" href="/css/style.css">
<style>
.auth-card{max-width:460px;margin:48px auto;padding:30px;background:#fff;border:1px solid #e0e7e3;border-radius:16px;box-shadow:0 8px 28px #0000000a}
.auth-card label{display:block;margin:16px 0 7px;font-weight:700}
.auth-card input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5d1;border-radius:8px;font-size:16px}
.auth-card button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:8px;background:#086b50;color:white;font-weight:700;cursor:pointer}
.password-field{position:relative}
.password-field input{padding-right:38px}
.auth-card .password-toggle{position:absolute;top:50%;right:10px;display:grid;width:18px;height:18px;margin:0;padding:0;transform:translateY(-50%);place-items:center;border:0;border-radius:0;background:transparent;color:#56645e;cursor:pointer}
.password-toggle svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:2}
.password-toggle .eye-off{display:none}
.password-toggle[aria-pressed="true"] .eye{display:none}
.password-toggle[aria-pressed="true"] .eye-off{display:block}
.note{font-size:14px;color:#56645e}#message{overflow-wrap:anywhere}
</style></head>
<body>
<header class="site-header"><div class="container header-inner"><a class="logo" href="/">TIN MỚI<span>.</span></a><nav><a href="/">Trang chủ</a></nav></div></header>
<main class="container"><section class="auth-card">
<p class="eyebrow">TÀI KHOẢN NGƯỜI DÙNG</p><h1>Tạo tài khoản</h1>
<p>Nhập email bạn đang sử dụng. Bạn cần xác minh mã gửi đến email để hoàn tất đăng ký.</p>
<form id="register-form">
<div id="details">
<label for="username">Tên tài khoản</label><input id="username" name="username" minlength="3" maxlength="30" autocomplete="username" required>
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
<label for="password">Mật khẩu (ít nhất 8 ký tự)</label><div class="password-field"><input id="password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required><button class="password-toggle" type="button" aria-label="Hiện mật khẩu" aria-pressed="false" aria-controls="password"><svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a14.8 14.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.5 10.5 0 0 0 4.2-.9"></path></svg></button></div>
<button type="submit">Gửi mã xác minh</button>
</div>
<div id="verify" hidden>
<label for="otp">Mã OTP trong email</label><input
  id="otp"
  name="otp"
  inputmode="numeric"
  pattern="[0-9]{6}"
  maxlength="6"
  autocomplete="one-time-code"
>
<button type="button" id="verify-btn">Xác minh và tạo tài khoản</button>
</div>
<p id="message" role="status" aria-live="polite"></p>
</form><p class="note">Đã có tài khoản? <a href="/user-login.html">Đăng nhập</a></p>
</section></main>
<script>
const form=document.getElementById("register-form"), message=document.getElementById("message");
const passwordInput=document.getElementById("password"), passwordToggle=document.querySelector(".password-toggle");
passwordToggle.addEventListener("click",()=>{
 const isVisible=passwordInput.type==="text";
 passwordInput.type=isVisible?"password":"text";
 passwordToggle.setAttribute("aria-pressed",String(!isVisible));
 passwordToggle.setAttribute("aria-label",isVisible?"Hiện mật khẩu":"Ẩn mật khẩu");
});
let pendingEmail="";
form.addEventListener("submit",async(e)=>{
 e.preventDefault();
 const username=form.username.value.trim(),email=form.email.value.trim().toLowerCase(),password=form.password.value;
 message.textContent="Đang gửi mã xác minh...";
 try{
  const r=await fetch("/api/auth/register/request-otp",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,email,password})});
  const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Không gửi được mã.");
  pendingEmail=email;document.getElementById("details").hidden=true;document.getElementById("verify").hidden=false;
  document.getElementById("otp").required=true;message.textContent=d.message;
 }catch(err){message.textContent=err.message;}
});
document.getElementById("verify-btn").addEventListener("click",async()=>{
 const otp=form.otp.value.trim();message.textContent="Đang xác minh...";
 try{
  const r=await fetch("/api/auth/register/verify-otp",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:pendingEmail,otp})});
  const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Xác minh thất bại.");
  message.textContent=d.message+" Chuyển đến trang đăng nhập...";
  setTimeout(() => {
  window.location.href = "/user-login.html";
}, 1200);
 }catch(err){message.textContent=err.message;}
});
</script></body></html>
