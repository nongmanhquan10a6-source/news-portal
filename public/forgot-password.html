<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quên mật khẩu - Tin Mới</title><link rel="stylesheet" href="/css/style.css">
<style>
.auth-card{max-width:460px;margin:48px auto;padding:30px;background:#fff;border:1px solid #e0e7e3;border-radius:16px;box-shadow:0 8px 28px #0000000a}
.auth-card label{display:block;margin:16px 0 7px;font-weight:700}
.auth-card input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd5d1;border-radius:8px;font-size:16px}
.auth-card button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:8px;background:#086b50;color:white;font-weight:700;cursor:pointer}
.password-field{position:relative}
.password-field input{padding-right:38px}
.auth-card .password-toggle{position:absolute;top:50%;right:10px;display:grid;width:18px;height:18px;margin:0;padding:0;transform:translateY(-50%);place-items:center;border:0;border-radius:0;background:transparent;color:#56645e;cursor:pointer}
.password-toggle svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:2}
.password-toggle .eye-off{display:none}
.password-toggle[aria-pressed="true"] .eye{display:none}
.password-toggle[aria-pressed="true"] .eye-off{display:block}
#message{overflow-wrap:anywhere}
</style></head>
<body>
<header class="site-header"><div class="container header-inner"><a class="logo" href="/">TIN MỚI<span>.</span></a><nav><a href="/">Trang chủ</a></nav></div></header>
<main class="container"><section class="auth-card">
<p class="eyebrow">KHÔI PHỤC TÀI KHOẢN</p><h1>Quên mật khẩu?</h1>
<p>Nhập email liên kết với tài khoản. Nếu tìm thấy tài khoản phù hợp, hệ thống sẽ gửi mã OTP.</p>
<form id="reset-form">
<div id="email-step">
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
<button type="submit">Gửi mã OTP</button>
</div>
<div id="password-step" hidden>
<label for="otp">Mã OTP 6 chữ số</label><input id="otp" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code">
<label for="newPassword">Mật khẩu mới (ít nhất 8 ký tự)</label><div class="password-field"><input id="newPassword" name="newPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password"><button class="password-toggle" type="button" aria-label="Hiện mật khẩu" aria-pressed="false" aria-controls="newPassword"><svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a14.8 14.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.5 10.5 0 0 0 4.2-.9"></path></svg></button></div>
<label for="confirmPassword">Nhập lại mật khẩu mới</label><div class="password-field"><input id="confirmPassword" name="confirmPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password"><button class="password-toggle" type="button" aria-label="Hiện mật khẩu" aria-pressed="false" aria-controls="confirmPassword"><svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a14.8 14.8 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.5 10.5 0 0 0 4.2-.9"></path></svg></button></div>
<button type="button" id="reset-btn">Xác minh OTP và đổi mật khẩu</button>
</div><p id="message" role="status" aria-live="polite"></p>
</form><p><a href="/user-login.html">Quay lại đăng nhập</a> · <a href="/login.html">Đăng nhập admin</a></p>
</section></main>
<script>
const form=document.getElementById("reset-form"),message=document.getElementById("message");
document.querySelectorAll(".password-toggle").forEach((toggle)=>{
 const input=document.getElementById(toggle.getAttribute("aria-controls"));
 toggle.addEventListener("click",()=>{
  const isVisible=input.type==="text";
  input.type=isVisible?"password":"text";
  toggle.setAttribute("aria-pressed",String(!isVisible));
  toggle.setAttribute("aria-label",isVisible?"Hiện mật khẩu":"Ẩn mật khẩu");
 });
});
let email="";
form.addEventListener("submit",async(e)=>{
 e.preventDefault();email=form.email.value.trim().toLowerCase();message.textContent="Đang xử lý yêu cầu...";
 try{
  const r=await fetch("/api/auth/password/request-reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});
  const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Không thể gửi yêu cầu.");
  document.getElementById("email-step").hidden=true;document.getElementById("password-step").hidden=false;
  document.getElementById("otp").required=true;document.getElementById("newPassword").required=true;document.getElementById("confirmPassword").required=true;
  message.textContent=d.message+" Nếu chưa nhận được thư, hãy kiểm tra thư rác và địa chỉ email.";
 }catch(err){message.textContent=err.message;}
});
document.getElementById("reset-btn").addEventListener("click",async()=>{
 const otp=form.otp.value.trim(),newPassword=form.newPassword.value,confirmPassword=form.confirmPassword.value;
 if(newPassword!==confirmPassword){message.textContent="Hai mật khẩu không khớp.";return;}
 message.textContent="Đang xác minh OTP và cập nhật mật khẩu...";
 try{
  const r=await fetch("/api/auth/password/reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,otp,newPassword})});
  const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||"Không thể đổi mật khẩu.");
  message.textContent=d.message+" Đang chuyển đến trang đăng nhập...";
  setTimeout(() => {
  window.location.href = "/user-login.html";
}, 1300);
 }catch(err){message.textContent=err.message;}
});
</script></body></html>
